Title: Clippsly Audio Downloader
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippsly Audio Downloader</title>
    <link rel="stylesheet" href="styles.css">
    {% include favicon.html %}
</head>
<body>
<h1>Clippsly Audio Downloader</h1>
<p>Enter the track id and then copy the link that appears after "audioFile"</p>
<form id="downloader">
  <label for="userInput">Enter Track ID:</label>
  <input type="text" id="userInput" required>
  
  <button type="submit">Submit</button>
</form>
<script>
  const form = document.getElementById('downloader');
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    const userInputValue = document.getElementById('userInput').value;
    getTrack(userInputValue);
  });

  function getTrack(data) {
  const iframe = document.createElement('iframe');
  iframe.src = 'https://api.clippsly.app/endpoints/data/track?id='+data;
  iframe.width = '50%';
  iframe.height = '500px';
  iframe.style.border = 'none';
  document.body.appendChild(iframe);
  }
</script>
<p>Tutorial:</p>
<iframe width="560" height="315" src="https://www.youtube.com/embed/yeX2UIlQ8WU?si=olOxRsR07D5hTd8H" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
