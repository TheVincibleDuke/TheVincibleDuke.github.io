---
Title: Clippsly Audio Downloader
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippsly Audio Downloader</title>
    <link rel="stylesheet" href="styles.css">
    {% include favicon.html %}
</head>
<body>
<h1>Clippsly Audio Downloader</h1>
<form id="downloader">
  <label for="userInput">Enter Track ID:</label>
  <input type="text" id="userInput" required>
  
  <button type="submit">Submit</button>
</form>
<script>
  const form = document.getElementById('downloader');
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    const userInputValue = document.getElementById('userInput').value;
    getTrack(userInputValue);
  });

  function getTrack(data) {
   fetch('https://api.clippsly.app/endpoints/data/track?id=' + data)
  .then(response => response.json())
  .then(data => console.log(data))
  .catch(error => console.error('Error:', error));
  }
</script>
</body>
</html>
